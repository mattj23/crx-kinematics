name: Wheels

# Builds the full wheel matrix and the sdist. This workflow deliberately has no publish step of its
# own: release.yml calls it via `workflow_call` and does the publishing, while `workflow_dispatch`
# lets the whole matrix be exercised from any branch without pushing a tag.
on:
  workflow_call:
  workflow_dispatch:

# The group is prefixed with a literal rather than `github.workflow`, because in a called workflow
# `github.workflow` resolves to the *caller's* name. Sharing a group with the calling release run
# would make these jobs queue behind a run that is itself waiting on them, which deadlocks.
# Superseded branch dispatches are cancelled, but a release build never is.
concurrency:
  group: wheels-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # pyo3 is built with the abi3-py38 feature, so a single wheel per platform covers Python 3.8 and
  # up and the interpreter used to build it does not set that floor. That means there is no need to
  # install an end-of-life Python on the runners just to build against it, and no need for
  # --find-interpreter, which produces stray per-version wheels.
  BUILD_PYTHON: '3.12'
  MATURIN_ARGS: --release --out dist --manifest-path py-crx-kinematics/Cargo.toml

jobs:
  linux:
    name: manylinux ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: ${{ env.MATURIN_ARGS }}
          # Disabled for tags so that a release artifact is always built from a cold, known state.
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    name: musllinux ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: ${{ env.MATURIN_ARGS }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    name: windows ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          # Cross-compiled from the x64 runner rather than built natively on windows-11-arm. pyo3's
          # abi3 feature plus its `generate-import-lib` feature mean no arm64 interpreter is needed
          # to link, so the host x64 Python below is sufficient, and nothing in the dependency tree
          # needs to run arm64 code at build time.
          - runner: windows-latest
            target: aarch64
            python_arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON }}
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: ${{ env.MATURIN_ARGS }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    name: macos ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Intel Macs are covered explicitly. Without this, Intel Mac users fall back to the sdist,
          # which requires them to have a Rust toolchain installed.
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: ${{ env.MATURIN_ARGS }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path py-crx-kinematics/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: wheels-sdist
          path: dist

  test-wheel:
    name: Test built wheel
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-x86_64
          path: dist
      - name: Install the wheel
        run: |
          pip install pytest engeom
          pip install dist/*.whl
      # Tests the artifact that would actually be published, which is the only way to catch a
      # packaging fault such as a missing .pyi stub. Run from the repository root so
      # test_stub_drift.py finds the stub while `import crx_kinematics` resolves to the wheel.
      - name: Run the test suite against the wheel
        run: pytest py-crx-kinematics/python/tests/ -q -rs

  test-sdist:
    name: Test sdist builds from source
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          name: wheels-sdist
          path: dist
      # The sdist is the fallback for every platform the matrix above does not cover, and it has to
      # compile the path-dependency `crx-kinematics` crate that maturin vendors into it. Nothing
      # else in the pipeline proves that vendoring is intact.
      - name: Build and install from the sdist
        run: |
          pip install pytest engeom
          pip install dist/*.tar.gz
      - name: Run the test suite against the source build
        run: pytest py-crx-kinematics/python/tests/ -q -rs

[package]
name = "py-crx-kinematics"
version.workspace = true
edition.workspace = true
# The PyO3 binding crate is distributed through PyPI, never crates.io.
publish = false
description = "Python bindings for the crx-kinematics FANUC CRX kinematics library."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mattj23/crx-kinematics"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "crx_kinematics"
crate-type = ["cdylib"]

[dependencies]
# `extension-module` prevents the extension from linking libpython, as required for a wheel, and
# lets `cargo test` build this crate as part of the workspace. `abi3-py38` matches the
# `requires-python` minimum in pyproject.toml, so one wheel supports every compatible interpreter.
# `generate-import-lib` synthesizes the Python import library for the target architecture, so a
# Windows wheel can be cross-compiled without an interpreter of that architecture on the runner.
# The windows-aarch64 wheel is built that way; see the matrix in .github/workflows/wheels.yml.
pyo3 = { version = "0.28.3", features = [
    "abi3-py38",
    "extension-module",
    "generate-import-lib",
] }
numpy = "0.28.0"
# Import the Rust library as `crx` to distinguish it from this crate's `crx_kinematics` library
# target, whose name must match the Python module.
crx = { package = "crx-kinematics", path = "../crx-kinematics" }

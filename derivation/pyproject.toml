# This development-only derivation project contains the NumPy inverse-kinematics reference
# implementation, its tests, and the tools that draw documentation figures. The separately
# configured `py-crx-kinematics` project builds the published Python package and shares no package
# contents with this project.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crx-derivation"
version = "0.1.1"
description = "Reference implementation and figure tooling for the CRX kinematics derivation."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    # The drawing code requires the engeom 0.5 API, which renamed the plotting helpers and moved
    # them out of a private module. engeom 0.4 and earlier are incompatible.
    "engeom>=0.5",
    "matplotlib",
    "pytest",
]

# `Robot.draw` renders into a PyVista scene, but it takes the helper from its caller and this
# package never imports PyVista itself. Leaving it out of the hard dependencies keeps VTK, which is
# most of a gigabyte, out of any environment that only runs the tests or draws the figures.
[project.optional-dependencies]
pyvista = [
    "pyvista",
]

# There is no package data. The link meshes this project draws with belong to the Rust crate now,
# and `crx.robot` reads them from `../crx-kinematics/meshes` in the checkout. This path requires an
# editable installation; a wheel does not contain the mesh data.
[tool.setuptools]
packages = ["crx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

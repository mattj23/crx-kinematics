[package]
name = "crx-kinematics"
description = "Forward and inverse kinematics for the FANUC CRX series of collaborative robots."
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
# The oldest toolchain the crate has been checked against. Edition 2024 sets a floor of 1.85, but
# tol-compress requires 1.88, which now sets the floor for the whole crate. The floor applies even
# with the `meshes` feature off, because a manifest can only declare one.
rust-version = "1.88"
readme = "README.md"
repository = "https://github.com/mattj23/crx-kinematics"
documentation = "https://docs.rs/crx-kinematics"
keywords = ["robotics", "kinematics", "fanuc", "robot", "ik"]
categories = ["science::robotics", "mathematics"]

[features]
# Link meshes are enabled by default so callers can draw a robot without first enabling a feature.
# Setting `default-features = false` removes the tol-compress dependency, approximately 460 KB of
# embedded geometry, and the `meshes` module.
default = ["meshes"]
meshes = ["dep:tol-compress"]

[dependencies]
# nalgebra provides the isometries, points, and vectors needed for the library's arithmetic. It is
# the only unconditional dependency.
nalgebra = { workspace = true }

# Decoder for the embedded link geometry, which is stored in the tcmesh format. It has no
# dependencies of its own, so the `meshes` feature adds one crate to a consumer's dependency graph.
tol-compress = { version = "0.2", optional = true }


[lib]
# Disable the library's unit-test benchmark because its harness rejects Criterion's arguments.
bench = false

[dev-dependencies]
criterion = "0.7.0"
approx = "0.5.1"
rand = "0.10.0"
# serde and serde_json are used only to read test fixtures.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[[bench]]
name = "solver_stages"
harness = false
